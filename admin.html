<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin · VIT cgpa</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script src="js/common.js"></script>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="./" aria-label="VIT cgpa home"><b>VIT</b><span>cgpa</span></a>
    <nav>
      <a class="navlink" href="calc">Calc<span class="nav-text">ulator</span></a>
      <a class="navlink" href="cgpa">CGPA</a>
      <a class="navlink" href="share">Share</a>
      <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch light or dark mode">
        <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>

<main class="wrap pf">
  <div class="page-title"><div><h1>Admin</h1><p>Subject requests from students.</p></div></div>

  <form class="card cg-card ad-key" id="ad-login" hidden novalidate>
    <div class="card-body">
      <label class="field"><span>Admin key</span><input class="input" type="password" name="key" autocomplete="current-password"></label>
      <p class="err" id="ad-err"></p>
      <div><button class="btn btn-primary" type="submit">Open</button></div>
    </div>
  </form>

  <section id="ad-main" hidden>
    <div class="stats ad-stats">
      <div class="stat"><small>Marks calculated</small><b id="ad-calc">0</b></div>
      <div class="stat"><small>Signed-up students</small><b id="ad-users">0</b></div>
    </div>
    <div class="ad-bar">
      <div class="seg" role="group" aria-label="Show requests">
        <button type="button" data-filter="new" aria-pressed="true">New</button>
        <button type="button" data-filter="added" aria-pressed="false">Added</button>
        <button type="button" data-filter="rejected" aria-pressed="false">Rejected</button>
        <button type="button" data-filter="all" aria-pressed="false">All</button>
      </div>
      <button type="button" class="btn btn-sm btn-ghost" id="ad-out">Lock</button>
    </div>
    <ul class="sem-list" id="ad-list"></ul>
  </section>
</main>
<script src="js/admin.js"></script>
</body>
</html>
